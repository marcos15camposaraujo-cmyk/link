<style>
/* Layout: single centered column, avatar + name on top, stacked full-width link buttons, small footer */
:root {
  --bg: #000000;
  --surface: transparent;
  --fg: #ffffff;
  --muted: rgba(255, 255, 255, 0.72);
  --line: rgba(255, 255, 255, 0.55);
  --accent: #ffffff;
  --accent-fg: #ffffff;
  --font-display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-block: 40px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100%;
}
#rain {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  display: block;
  background: #000;
}
.wrap {
  max-width: 440px;
  margin-inline: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 80vh;
  gap: 28px;
}
header {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  text-align: center;
  min-width: 0;
}
.avatar {
  width: 96px;
  height: 96px;
  border-radius: 50%;
  background:
    radial-gradient(120% 140% at 25% 5%, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0) 60%),
    linear-gradient(135deg, rgba(160, 215, 255, 0.22), rgba(255, 255, 255, 0.05));
  -webkit-backdrop-filter: blur(10px) saturate(1.5);
  backdrop-filter: blur(10px) saturate(1.5);
  border: 1px solid rgba(255, 255, 255, 0.45);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.7), 0 10px 28px rgba(0, 0, 0, 0.45);
  color: var(--fg);
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 34px;
  letter-spacing: 0.02em;
  margin-bottom: 10px;
}
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 28px;
  line-height: 1.15;
  letter-spacing: -0.01em;
  text-wrap: balance;
}
.handle {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
  font-weight: 500;
}
.bio {
  margin: 8px 0 0;
  max-width: 34ch;
  color: var(--fg);
  text-wrap: balance;
}
nav {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.link {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-width: 0;
  position: relative;
  overflow: hidden;
  padding: 16px 24px;
  background:
    radial-gradient(120% 140% at 15% 0%, rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0) 55%),
    linear-gradient(135deg, rgba(160, 215, 255, 0.20), rgba(255, 255, 255, 0.04));
  -webkit-backdrop-filter: blur(10px) saturate(1.5);
  backdrop-filter: blur(10px) saturate(1.5);
  color: var(--fg);
  border: 1px solid rgba(255, 255, 255, 0.38);
  border-radius: 999px;
  box-shadow:
    inset 0 1px 1px rgba(255, 255, 255, 0.65),
    inset 0 -10px 18px rgba(120, 190, 255, 0.12),
    0 10px 28px rgba(0, 0, 0, 0.45);
  text-decoration: none;
  font-weight: 600;
  transition: transform 0.15s ease, border-color 0.15s ease;
}
.link span { min-width: 0; overflow-wrap: anywhere; }
.link svg { flex: none; width: 18px; height: 18px; color: var(--muted); transition: transform 0.15s ease, color 0.15s ease; }
.link:hover { border-color: var(--accent); transform: translateY(-1px); }
.link:hover svg { color: var(--accent); transform: translateX(2px); }
.link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.link::before {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: -60%;
  width: 45%;
  background: linear-gradient(100deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0));
  transform: skewX(-18deg);
  transition: left 0.7s ease;
  pointer-events: none;
}
.link:hover::before, .link:focus-visible::before { left: 120%; }
.link:hover { border-color: rgba(255, 255, 255, 0.75); }
.link:nth-child(odd) { animation: bob 6s ease-in-out infinite; }
.link:nth-child(even) { animation: bob 7s ease-in-out infinite reverse; }
@keyframes bob {
  0%, 100% { translate: 0 0; }
  50% { translate: 0 -3px; }
}
.link.primary svg { color: var(--accent-fg); }
.link.primary:hover svg { color: var(--accent-fg); }
h1, .handle { text-shadow: 0 1px 12px rgba(0, 0, 0, 0.9); }
footer {
  text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9);
  color: var(--muted);
  font-size: 13px;
  text-align: center;
}
@media (prefers-reduced-motion: reduce) {
  .link, .link svg, .link::before { transition: none; animation: none; }
  .link:hover { transform: none; }
}
</style>

<script>
(function () {
  var cv = document.getElementById("rain");
  var ctx = cv.getContext("2d");
  var img = document.getElementById("bgsrc");
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var CW = 8, CH = 12;
  var W, H, dpr, cols, rows, map, heads, speeds, lastT = 0, lastDraw = 0, rt;

  function buildMap() {
    map = new Float32Array(cols * rows);
    map.fill(0.7);
    if (!img.complete || !img.naturalWidth) return;
    var o = document.createElement("canvas");
    o.width = cols;
    o.height = rows;
    var x = o.getContext("2d");
    var s = Math.max(cols / img.naturalWidth, rows / img.naturalHeight);
    var dw = img.naturalWidth * s, dh = img.naturalHeight * s;
    x.fillStyle = "#000";
    x.fillRect(0, 0, cols, rows);
    x.drawImage(img, (cols - dw) / 2, 0, dw, dh);
    try {
      var d = x.getImageData(0, 0, cols, rows).data, mx = 1, i;
      for (i = 0; i < cols * rows; i++) {
        var v = d[i * 4 + 1];
        map[i] = v;
        if (v > mx) mx = v;
      }
      for (i = 0; i < map.length; i++) map[i] = Math.pow(map[i] / mx, 0.7);
    } catch (e) {
      map.fill(0.7);
    }
  }

  function layout() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    cols = Math.ceil(W / CW);
    rows = Math.ceil(H / CH);
    buildMap();
    heads = [];
    speeds = [];
    for (var c = 0; c < cols; c++) {
      heads.push(Math.random() * (rows + 40) - 10);
      speeds.push(5 + Math.random() * 10);
    }
  }

  function draw(t) {
    if (!lastT) lastT = t;
    var dt = Math.min((t - lastT) / 1000, 0.1);
    lastT = t;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);
    ctx.font = '11px "Courier New", ui-monospace, monospace';
    ctx.textBaseline = "top";
    for (var c = 0; c < cols; c++) {
      heads[c] += speeds[c] * dt;
      if (heads[c] > rows + 40) {
        heads[c] = -Math.random() * 30;
        speeds[c] = 5 + Math.random() * 10;
      }
      for (var r = 0; r < rows; r++) {
        var i = r * cols + c;
        var m = map[i];
        if (m < 0.04) continue;
        var dist = heads[c] - r;
        var trail = dist < 0 ? 0 : Math.exp(-dist / 14);
        var a = m * (0.28 + 0.72 * trail) * 1.5;
        a *= 0.88 + 0.12 * Math.sin(t / 300 + i * 12.9898);
        if (a > 1) a = 1;
        ctx.globalAlpha = a;
        ctx.fillStyle = dist >= 0 && dist < 1.2 ? "#d2ffe1" : "#5fd28c";
        ctx.fillText("1", c * CW, r * CH);
      }
    }
    ctx.globalAlpha = 1;
  }

  function loop(t) {
    requestAnimationFrame(loop);
    if (t - lastDraw < 40) return;
    lastDraw = t;
    draw(t);
  }

  function start() {
    layout();
    if (reduce) draw(0);
    else requestAnimationFrame(loop);
  }

  window.addEventListener("resize", function () {
    clearTimeout(rt);
    rt = setTimeout(function () {
      layout();
      if (reduce) draw(0);
    }, 150);
  });

  if (img.complete) start();
  else {
    img.addEventListener("load", start);
    img.addEventListener("error", start);
  }
})();
</script>
